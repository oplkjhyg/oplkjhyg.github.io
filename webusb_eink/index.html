<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1-bit Image Tool (Crop → Filter → Serial via Web Serial API)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; line-height: 1.5; }
  h1 { text-align: center; color: #333; }
  .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .left, .right { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  #imageContainer { width: 100%; max-height: 520px; background: #111; border-radius: 8px; overflow: hidden; }
  #imageContainer img { max-width: 100%; display: block; margin: auto; }
  .controls { margin: 20px 0; padding: 15px; background: #f9f9f9; border-radius: 8px; }
  .preview-box { border: 2px dashed #aaa; height: 320px; background: #fff; display: flex; align-items: center; justify-content: center; border-radius: 8px; overflow: hidden; }
  canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
  input, button, select { margin: 8px 0; padding: 10px; width: 100%; font-size: 1em; border-radius: 6px; border: 1px solid #ccc; }
  button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
  button:hover { background: #0056b3; }
  button:disabled { background: #888; cursor: not-allowed; }
  .row { display: flex; gap: 10px; }
  .row input { flex: 1; }
  .drop-zone {
    border: 4px dashed #999;
    padding: 60px;
    text-align: center;
    font-size: 1.4em;
    background: #fff;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .drop-zone.dragover { border-color: #007bff; background: #e3f2fd; }
  .hidden { display: none; }
  .status { margin-top: 10px; padding: 12px; background: #e0f7fa; border-radius: 6px; font-family: monospace; }
  label { display: block; margin: 10px 0 5px; font-weight: bold; }
  #portsList { margin-bottom: 10px; }
  #portsList button { width: auto; margin: 5px; padding: 5px 10px; background: #28a745; }
  #portsList button:hover { background: #218838; }
</style>
</head>
<body>

<h1>1-bit Image Processor (Crop → Filter → Serial Send)</h1>

<div id="dropZone" class="drop-zone">
  Drag & drop an image here or<br><br>
  <button id="fileSelect">Choose Image File</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<div class="container hidden" id="mainApp">
  <div class="left">
    <div id="imageContainer"></div>

    <div class="controls">
      <h3>Crop Controls</h3>
      <div class="row">
        <input type="number" id="cropWidth" placeholder="Width (px)" min="1">
        <input type="number" id="cropHeight" placeholder="Height (px)" min="1">
      </div>
      <button id="applyCropSize">Apply Fixed Size</button>
      <button id="rotateLeft">Rotate Left 90°</button>
      <button id="rotateRight">Rotate Right 90°</button>
      <button id="resetCrop">Reset Image</button>
    </div>

    <div class="controls">
      <h3>Image Filters</h3>
      <label><input type="radio" name="filter" value="none" checked> Original (Color)</label>
      <label><input type="radio" name="filter" value="grayscale"> Grayscale</label>
      <div style="margin-left:20px;">
        Contrast: <input type="range" id="contrast" min="0" max="200" value="100">
        <span id="contrastValue">100</span>%
      </div>
      <label><input type="radio" name="filter" value="bw"> Black & White</label>
      <div style="margin-left:20px;">
        Threshold: <input type="range" id="threshold" min="0" max="255" value="128">
        <span id="thresholdValue">128</span>
      </div>
      <label><input type="checkbox" id="dither"> Enable Dithering (Floyd-Steinberg)</label>
    </div>

    <div class="controls">
      <h3>Serial Output (1 byte = 8 pixels)</h3>
      <div id="serialControls">
        <button id="selectPort">Select Serial Port</button>
        <div id="portsList" class="hidden"></div>
        <select id="baudRate" class="hidden">
          <option value="9600">9600</option>
          <option value="19200">19200</option>
          <option value="38400">38400</option>
          <option value="57600">57600</option>
          <option value="115200" selected>115200</option>
          <option value="230400">230400</option>
          <option value="460800">460800</option>
          <option value="921600">921600</option>
        </select>
        <button id="connectBtn" class="hidden" disabled>Connect</button>
        <button id="sendBtn" disabled>Send 1-bit Image</button>
        <button id="disconnectBtn" class="hidden">Disconnect</button>
      </div>
      <div class="status" id="serialStatus">Not connected</div>
    </div>
  </div>

  <div class="right">
    <h3>Cropped Preview</h3>
    <div class="preview-box"><canvas id="previewCanvas"></canvas></div>

    <h3>Final 1-bit Result</h3>
    <div class="preview-box"><canvas id="filteredCanvas"></canvas></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script>
// Global vars
let cropper = null;
let port = null;
let writer = null;
let reader = null;
let ports = [];

// DOM Elements
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileSelect = document.getElementById('fileSelect');
const mainApp = document.getElementById('mainApp');
const imageContainer = document.getElementById('imageContainer');
const previewCanvas = document.getElementById('previewCanvas');
const filteredCanvas = document.getElementById('filteredCanvas');
const previewCtx = previewCanvas.getContext('2d');
const filteredCtx = filteredCanvas.getContext('2d');

// Serial DOM
const selectPortBtn = document.getElementById('selectPort');
const portsList = document.getElementById('portsList');
const baudRate = document.getElementById('baudRate');
const connectBtn = document.getElementById('connectBtn');
const sendBtn = document.getElementById('sendBtn');
const disconnectBtn = document.getElementById('disconnectBtn');
const serialStatus = document.getElementById('serialStatus');

// Drag & Drop
['dragover', 'dragenter'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.add('dragover'); }));
['dragleave', 'dragend'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('dragover')));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileSelect.onclick = () => fileInput.click();
fileInput.onchange = e => { if (e.target.files[0]) handleFile(e.target.files[0]); };
imageContainer.addEventListener('click', e => e.stopPropagation());

function handleFile(file) {
  if (!file.type.startsWith('image/')) return alert('Please select an image');
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      imageContainer.innerHTML = '';
      imageContainer.appendChild(img);
      initCropper(img);
      mainApp.classList.remove('hidden');
      dropZone.classList.add('hidden');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function initCropper(img) {
  if (cropper) cropper.destroy();
  cropper = new Cropper(img, {
    viewMode: 1,
    dragMode: 'move',
    autoCropArea: 0.9,
    restore: false,
    guides: true,
    cropBoxMovable: true,
    cropBoxResizable: true,
    ready: () => updatePreview(),
    crop: () => updatePreview()
  });
}

function updatePreview() {
  if (!cropper) return;
  const cropped = cropper.getCroppedCanvas();
  previewCanvas.width = cropped.width;
  previewCanvas.height = cropped.height;
  previewCtx.drawImage(cropped, 0, 0);
  applyFilters();
}

// Crop controls
document.getElementById('applyCropSize').onclick = () => {
  const w = parseInt(document.getElementById('cropWidth').value);
  const h = parseInt(document.getElementById('cropHeight').value);
  if (w > 0 && h > 0) cropper.setCropBoxData({ width: w, height: h });
};
document.getElementById('rotateLeft').onclick = () => cropper.rotate(-90);
document.getElementById('rotateRight').onclick = () => cropper.rotate(90);
document.getElementById('resetCrop').onclick = () => cropper.reset();

// Filters
document.querySelectorAll('input[name="filter"]').forEach(el => el.onchange = applyFilters);
document.getElementById('contrast').oninput = e => {
  document.getElementById('contrastValue').textContent = e.target.value;
  applyFilters();
};
document.getElementById('threshold').oninput = e => {
  document.getElementById('thresholdValue').textContent = e.target.value;
  applyFilters();
};
document.getElementById('dither').onchange = applyFilters;

function applyFilters() {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas();
  filteredCanvas.width = canvas.width;
  filteredCanvas.height = canvas.height;
  const ctx = filteredCtx;
  ctx.drawImage(canvas, 0, 0);

  let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let data = imageData.data;

  const mode = document.querySelector('input[name="filter"]:checked').value;
  const contrast = document.getElementById('contrast').value / 100;
  const threshold = parseInt(document.getElementById('threshold').value);
  const dither = document.getElementById('dither').checked;

  // Grayscale + contrast
  for (let i = 0; i < data.length; i += 4) {
    let r = data[i], g = data[i+1], b = data[i+2];
    if (contrast !== 1) {
      const f = (259 * (contrast + 1)) / (259 * (2 - contrast));
      r = truncate(f * (r - 128) + 128);
      g = truncate(f * (g - 128) + 128);
      b = truncate(f * (b - 128) + 128);
    }
    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
    data[i] = data[i+1] = data[i+2] = gray;
  }

  if (mode === 'bw') {
    for (let i = 0; i < data.length; i += 4) {
      data[i] = data[i+1] = data[i+2] = data[i] > threshold ? 255 : 0;
    }
  }

  if (dither && (mode === 'grayscale' || mode === 'bw')) {
    floydSteinbergDither(imageData);
  }

  ctx.putImageData(imageData, 0, 0);
}

function truncate(v) { return Math.max(0, Math.min(255, Math.round(v))); }

function floydSteinbergDither(imgData) {
  const w = imgData.width, h = imgData.height, d = imgData.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const old = d[i];
      const neu = old < 128 ? 0 : 255;
      const err = old - neu;
      d[i] = d[i+1] = d[i+2] = neu;
      if (x + 1 < w)           distribute(x + 1, y, err, 7/16);
      if (x > 0 && y + 1 < h)  distribute(x - 1, y + 1, err, 3/16);
      if (y + 1 < h)           distribute(x, y + 1, err, 5/16);
      if (x + 1 < w && y + 1 < h) distribute(x + 1, y + 1, err, 1/16);
    }
  }
  function distribute(px, py, err, coeff) {
    if (!err) return;
    const i = (py * w + px) * 4;
    const val = d[i] + err * coeff;
    d[i] = d[i+1] = d[i+2] = truncate(val);
  }
}

// Web Serial API - Inspired by tigoe.github.io example
selectPortBtn.addEventListener('click', async () => {
  try {
    ports = await navigator.serial.getPorts();
    if (ports.length === 0) {
      port = await navigator.serial.requestPort({ filters: [] });
      ports = [port];
    }
    populatePortsList();
    portsList.classList.remove('hidden');
    baudRate.classList.remove('hidden');
    connectBtn.disabled = false;
    selectPortBtn.textContent = 'Refresh Ports';
  } catch (err) {
    serialStatus.textContent = 'Error selecting port: ' + err.message;
  }
});

function populatePortsList() {
  portsList.innerHTML = '';
  ports.forEach((p, index) => {
    const btn = document.createElement('button');
    btn.textContent = `Port ${index + 1}: ${p.getInfo ? p.getInfo().usbProductId ? `USB PID:${p.getInfo().usbProductId.toString(16)}` : 'Unknown' : 'Unknown'}`;
    btn.onclick = () => selectThisPort(p, index);
    portsList.appendChild(btn);
  });
}

let selectedPortIndex = -1;
function selectThisPort(selectedPort, index) {
  port = selectedPort;
  selectedPortIndex = index;
  portsList.innerHTML = `<strong>Selected: Port ${index + 1}</strong>`;
  connectBtn.disabled = false;
  connectBtn.textContent = 'Connect';
}

connectBtn.addEventListener('click', async () => {
  if (!port) return;
  try {
    const baud = parseInt(baudRate.value);
    await port.open({ baudRate: baud });
    writer = port.writable.getWriter();
    serialStatus.textContent = `Connected to Port ${selectedPortIndex + 1} @ ${baud} baud`;
    connectBtn.style.display = 'none';
    disconnectBtn.classList.remove('hidden');
    sendBtn.disabled = false;
    baudRate.disabled = true;
  } catch (err) {
    serialStatus.textContent = 'Connection failed: ' + err.message;
  }
});

disconnectBtn.addEventListener('click', async () => {
  if (writer) {
    await writer.close();
    writer = null;
  }
  await port.close();
  port = null;
  serialStatus.textContent = 'Disconnected';
  connectBtn.style.display = 'block';
  connectBtn.textContent = 'Reconnect';
  disconnectBtn.classList.add('hidden');
  sendBtn.disabled = true;
  baudRate.disabled = false;
  portsList.classList.add('hidden');
});

sendBtn.addEventListener('click', async () => {
  if (!writer || !cropper) return alert('Not connected or no image');

  const canvas = filteredCanvas;
  const imgData = filteredCtx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;

  const totalPixels = canvas.width * canvas.height;
  const byteCount = Math.ceil(totalPixels / 8);
  const bytes = new Uint8Array(byteCount);

  let byte = 0, bits = 0;
  let byteIndex = 0;

  for (let i = 0; i < data.length; i += 4) {
    const bit = data[i] < 128 ? 1 : 0;  // 1 = black pixel
    byte = (byte << 1) | bit;
    bits++;
    if (bits === 8) {
      bytes[byteIndex++] = byte;
      byte = 0;
      bits = 0;
    }
  }
  if (bits > 0) {
    bytes[byteIndex++] = byte << (8 - bits);
  }

  // Header: width (2 bytes) + height (2 bytes) big-endian
  const header = new Uint8Array(4);
  const view = new DataView(header.buffer);
  view.setUint16(0, canvas.width);
  view.setUint16(2, canvas.height);

  try {
    await writer.write(header);
    await writer.write(bytes.subarray(0, byteIndex));
    serialStatus.textContent = `Sent ${byteIndex} bytes (${canvas.width}×${canvas.height})`;
  } catch (err) {
    serialStatus.textContent = 'Send failed: ' + err.message;
  }
});
</script>
</body>
</html>
