<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1-bit OLED Tool – Mobile Optimized</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0066ff">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<style>
  :root {
    --primary: #0066ff;
    --bg: #f5f7fa;
    --card: white;
    --text: #1c1c1e;
    --border: #e0e0e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0f;
      --card: #1c1c2e;
      --text: #e0e0e0;
      --border: #333;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100dvh;
    touch-action: manipulation;
  }

  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    padding: 12px;
  }

  h1 {
    text-align: center;
    margin: 8px 0 16px;
    font-size: 1.9em;
    font-weight: 700;
  }

  .drop-zone {
    border: 6px dashed #888;
    border-radius: 20px;
    padding: 70px 20px;
    text-align: center;
    font-size: 1.4em;
    background: var(--card);
    margin: 20px auto;
    max-width: 95vw;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  }
  .drop-zone.dragover {
    border-color: var(--primary);
    background: rgba(0, 102, 255, 0.1);
    transform: scale(1.02);
  }
  .drop-zone button {
    margin-top: 24px;
    padding: 16px 40px;
    font-size: 1.3em;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 16px;
    font-weight: 600;
    min-height: 56px;
  }

  .container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 10px;
  }

  .left, .right {
    background: var(--card);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.1);
  }

  #imageContainer {
    width: 100%;
    max-height: 45vh;
    overflow: hidden;
    background: #000;
    border-radius: 16px;
    margin-bottom: 16px;
    position: relative;
  }
  #imageContainer img {
    width: 100%;
    height: auto;
    display: block;
  }

  .controls {
    margin: 20px 0;
    padding: 18px;
    background: rgba(0,0,0,0.04);
    border-radius: 16px;
    border: 1px solid var(--border);
  }
  .controls h3 {
    margin: 0 0 14px;
    font-size: 1.4em;
    font-weight: 600;
  }

  input, button, select {
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    font-size: 1.1em;
    background: var(--card);
    color: var(--text);
  }
  input[type="range"] {
    height: 50px;
    -webkit-appearance: none;
    background: rgba(0,0,0,0.1);
    border-radius: 10px;
    margin: 16px 0;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  button {
    background: var(--primary);
    color: white;
    font-weight: 600;
    font-size: 1.15em;
    min-height: 56px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:active {
    transform: scale(0.97);
  }
  button:disabled {
    background: #888;
    transform: none;
  }

  .row {
    display: flex;
    gap: 12px;
  }
  .row input {
    flex: 1;
  }

  label {
    display: block;
    padding: 12px 0;
    font-size: 1.1em;
    cursor: pointer;
  }
  input[type="checkbox"], input[type="radio"] {
    width: auto;
    margin-right: 12px;
    transform: scale(1.4);
    accent-color: var(--primary);
  }

  .preview-box {
    width: 100%;
    height: 300px;
    margin: 20px 0;
    border: 3px dashed var(--border);
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  .preview-wrapper {
    width: 100%;
    height: 100%;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8f9fa;
    -webkit-overflow-scrolling: touch;
  }
  .preview-wrapper canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .status {
    padding: 16px;
    background: #d4edda;
    color: #155724;
    border-radius: 12px;
    font-family: 'Courier New', monospace;
    margin-top: 12px;
    font-size: 1em;
    word-break: break-all;
    border: 1px solid #c3e6cb;
  }

  .hidden { display: none !important; }

  @media (min-width: 768px) {
    .container { flex-direction: row; }
    .left, .right { flex: 1; }
    .preview-box { height: 380px; }
    body { padding: 20px; }
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.7em; }
    .drop-zone { padding: 50px 15px; font-size: 1.2em; }
    .preview-box { height: 260px; }
    .controls { padding: 16px; }
    button, input, select { font-size: 1.05em; padding: 14px; }
  }

  /* Fix Cropper.js touch issues on mobile */
  .cropper-container {
    touch-action: pan-x pan-y pinch-zoom;
  }
</style>
</head>
<body>

<h1>1-bit OLED Tool</h1>

<div id="dropZone" class="drop-zone">
  Drag & drop image here<br><br>or<br><br>
  <button id="fileSelect">Choose Photo</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<div class="container hidden" id="mainApp">
  <div class="left">
    <div id="imageContainer"></div>

    <div class="controls">
      <button id="newPhotoBtn">Load New Photo</button>
    </div>

    <div class="controls">
      <h3>Crop Size</h3>
      <div class="row">
        <input type="number" id="cropWidth" placeholder="Width" value="128">
        <input type="number" id="cropHeight" placeholder="Height" value="64">
      </div>
      <button id="applyCropSize">Apply Crop Size</button>
      <button id="rotateLeft">Rotate Left 90°</button>
      <button id="rotateRight">Rotate Right 90°</button>
      <button id="resetCrop">Reset Crop</button>
    </div>

    <div class="controls">
      <h3>Filters</h3>
      <label><input type="radio" name="filter" value="none" checked> Color (Preview Only)</label>
      <label><input type="radio" name="filter" value="grayscale"> Grayscale</label>
      <div style="margin-left:20px; margin-top:10px;">
        Contrast <input type="range" id="contrast" min="0" max="200" value="100">
        <span id="contrastValue">100</span>%
      </div>
      <label><input type="radio" name="filter" value="bw"> Black & White</label>
      <div style="margin-left:20px; margin-top:10px;">
        Threshold <input type="range" id="threshold" min="0" max="255" value="128">
        <span id="thresholdValue">128</span>
      </div>
      <label style="margin-top:16px;"><input type="checkbox" id="dither" checked> Enable Dithering (Floyd-Steinberg)</label>
    </div>

    <div class="controls">
      <h3>Output Format</h3>
      <label>
        <input type="checkbox" id="bitOneIsBlack" checked>
        <strong>1 = Black pixel</strong> (uncheck for 1 = White)
      </label>
    </div>

    <div class="controls">
      <h3>Send to Device (Web Serial)</h3>
      <button id="selectPort">Select Device</button>
      <select id="baudRate">
        <option value="115200" selected>115200 baud</option>
        <option value="921600">921600 baud</option>
        <option value="460800">460800 baud</option>
        <option value="230400">230400 baud</option>
      </select>
      <button id="sendBtn" disabled>Send Image</button>
      <button id="disconnectBtn" class="hidden">Disconnect</button>
      <div class="status" id="serialStatus">Ready – Connect a device to send</div>
    </div>
  </div>

  <div class="right">
    <h3>Cropped Preview</h3>
    <div class="preview-box">
      <div class="preview-wrapper"><canvas id="previewCanvas"></canvas></div>
    </div>

    <h3>1-bit Result (Final)</h3>
    <div class="preview-box">
      <div class="preview-wrapper"><canvas id="filteredCanvas"></canvas></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script>
// === ALL ORIGINAL JAVASCRIPT LOGIC PRESERVED 100% ===
// Only minor touch event fixes added for mobile reliability
// Fixed dithering: now uses user threshold and propagates error to all RGB channels
// Fixed crop fill: now fills empty/outside areas with white (#ffffff)

let cropper = null;
let port = null, writer = null, reader = null;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileSelect = document.getElementById('fileSelect');
const mainApp = document.getElementById('mainApp');
const imageContainer = document.getElementById('imageContainer');
const previewCanvas = document.getElementById('previewCanvas');
const filteredCanvas = document.getElementById('filteredCanvas');
const previewCtx = previewCanvas.getContext('2d');
const filteredCtx = filteredCanvas.getContext('2d');

function loadImageFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    alert('Please select a valid image file');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      imageContainer.innerHTML = '';
      imageContainer.appendChild(img);

      if (cropper) cropper.destroy();
      cropper = new Cropper(img, {
        viewMode: 0,
        dragMode: 'move',
        autoCropArea: 1,
        restore: false,
        guides: true,
        center: true,
        highlight: false,
        cropBoxMovable: true,
        cropBoxResizable: true,
        toggleDragModeOnDblclick: false,
        minCropBoxWidth: 1,
        minCropBoxHeight: 1,
        ready: updatePreview,
        crop: updatePreview,
        zoomable: true,
        scalable: true,
        touchDragZoom: true,
        mouseWheelZoom: true
      });

      mainApp.classList.remove('hidden');
      dropZone.classList.add('hidden');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Drag & Drop
dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) loadImageFile(file);
});

// File picker
fileSelect.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadImageFile(e.target.files[0]);
});

// New photo
document.getElementById('newPhotoBtn').addEventListener('click', () => {
  if (cropper) cropper.destroy();
  cropper = null;
  previewCanvas.width = filteredCanvas.width = 1;
  mainApp.classList.add('hidden');
  dropZone.classList.remove('hidden');
});

function updatePreview() {
  if (!cropper) return;
  const data = cropper.getCropBoxData();

  const cropped = cropper.getCroppedCanvas({
    width: Math.round(data.width),
    height: Math.round(data.height),
    imageSmoothingEnabled: false,
    fillColor: '#ffffff'
  });

  previewCanvas.width = cropped.width;
  previewCanvas.height = cropped.height;
  previewCtx.drawImage(cropped, 0, 0);

  applyFilters();
}

// Filters - unchanged logic, but dither now fixed internally
document.querySelectorAll('input[name="filter"]').forEach(el => el.addEventListener('change', applyFilters));
document.getElementById('contrast').addEventListener('input', e => {
  document.getElementById('contrastValue').textContent = e.target.value;
  applyFilters();
});
document.getElementById('threshold').addEventListener('input', e => {
  document.getElementById('thresholdValue').textContent = e.target.value;
  applyFilters();
});
document.getElementById('dither').addEventListener('change', applyFilters);

function applyFilters() {
  if (!cropper) return;
  const data = cropper.getCropBoxData();

  const cropped = cropper.getCroppedCanvas({
    width: Math.round(data.width),
    height: Math.round(data.height),
    imageSmoothingEnabled: false,
    fillColor: '#ffffff'
  });

  filteredCanvas.width = cropped.width;
  filteredCanvas.height = cropped.height;
  const ctx = filteredCtx;
  ctx.drawImage(cropped, 0, 0);

  let imgData = ctx.getImageData(0, 0, cropped.width, cropped.height);
  let d = imgData.data;

  const mode = document.querySelector('input[name="filter"]:checked').value;
  const contrast = document.getElementById('contrast').value / 100;
  const threshold = +document.getElementById('threshold').value;
  const dither = document.getElementById('dither').checked;

  if (contrast !== 1) {
    const f = (259 * (contrast + 1)) / (259 * (2 - contrast));
    for (let i = 0; i < d.length; i += 4) {
      for (let c = 0; c < 3; c++) {
        d[i+c] = Math.max(0, Math.min(255, f * (d[i+c] - 128) + 128));
      }
    }
  }

  for (let i = 0; i < d.length; i += 4) {
    const gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    d[i] = d[i+1] = d[i+2] = gray;
  }

  if (mode === 'bw') {
    for (let i = 0; i < d.length; i += 4) {
      d[i] = d[i+1] = d[i+2] = (d[i] > threshold ? 255 : 0);
    }
  }

  if (dither) {
    floydSteinbergDither(imgData, threshold);
  }

  ctx.putImageData(imgData, 0, 0);
}

function floydSteinbergDither(imgData, threshold) {
  const w = imgData.width, h = imgData.height, d = imgData.data;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const old = d[i];
      const neu = old < threshold ? 0 : 255;
      const err = (old - neu) / 16;
      d[i] = d[i+1] = d[i+2] = neu;

      if (x+1 < w) {
        d[i+4] += err*7;
        d[i+5] += err*7;
        d[i+6] += err*7;
      }
      if (x > 0 && y+1 < h) {
        d[i + w*4 -4] += err*3;
        d[i + w*4 -3] += err*3;
        d[i + w*4 -2] += err*3;
      }
      if (y+1 < h) {
        d[i + w*4] += err*5;
        d[i + w*4 +1] += err*5;
        d[i + w*4 +2] += err*5;
      }
      if (x+1 < w && y+1 < h) {
        d[i + w*4 +4] += err*1;
        d[i + w*4 +5] += err*1;
        d[i + w*4 +6] += err*1;
      }
    }
  }
}

// Crop controls
document.getElementById('applyCropSize').addEventListener('click', () => {
  const w = +document.getElementById('cropWidth').value || 128;
  const h = +document.getElementById('cropHeight').value || 64;
  cropper.setCropBoxData({ width: w, height: h });
});
document.getElementById('rotateLeft').addEventListener('click', () => cropper.rotate(-90));
document.getElementById('rotateRight').addEventListener('click', () => cropper.rotate(90));
document.getElementById('resetCrop').addEventListener('click', () => cropper.reset());

// Web Serial API - unchanged
let readLoopRunning = false;

document.getElementById('selectPort').addEventListener('click', async () => {
  if (!("serial" in navigator)) {
    alert("Web Serial API not supported in this browser.");
    return;
  }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: +document.getElementById('baudRate').value });
    writer = port.writable.getWriter();
    reader = port.readable.getReader();

    document.getElementById('serialStatus').textContent = 'Connected!';
    document.getElementById('selectPort').textContent = 'Connected';
    document.getElementById('selectPort').disabled = true;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('disconnectBtn').classList.remove('hidden');
    if (!readLoopRunning) readLoop();
  } catch (e) {
    document.getElementById('serialStatus').textContent = 'Error: ' + e.message;
  }
});

async function readLoop() {
  readLoopRunning = true;
  try {
    while (true) {
      const { done } = await reader.read();
      if (done) break;
    }
  } catch (e) {} finally {
    reader.releaseLock();
    readLoopRunning = false;
  }
}

document.getElementById('disconnectBtn').addEventListener('click', async () => {
  try {
    writer && await writer.close();
    reader && await reader.cancel();
    port && await port.close();
  } catch (e) {}
  document.getElementById('serialStatus').textContent = 'Disconnected';
  document.getElementById('selectPort').textContent = 'Select Device';
  document.getElementById('selectPort').disabled = false;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('disconnectBtn').classList.add('hidden');
});

document.getElementById('sendBtn').addEventListener('click', async () => {
  if (!writer || !cropper) return;

  const canvas = filteredCanvas;
  const data = filteredCtx.getImageData(0, 0, canvas.width, canvas.height).data;
  const bytesPerLine = Math.ceil(canvas.width / 8);
  const totalBytes = bytesPerLine * canvas.height;
  const bitmap = new Uint8Array(totalBytes);

  const oneIsBlack = document.getElementById('bitOneIsBlack').checked;

  let byte = 0, bits = 0, idx = 0;
  for (let i = 0; i < data.length; i += 4) {
    const black = data[i] < 128;
    const bit = oneIsBlack ? (black ? 1 : 0) : (black ? 0 : 1);
    byte = (byte << 1) | bit;
    if (++bits === 8) {
      bitmap[idx++] = byte;
      byte = bits = 0;
    }
  }
  if (bits) bitmap[idx] = byte << (8 - bits);

  await writer.write(new Uint8Array([0xDE, 0xAD]));
  await new Promise(r => setTimeout(r, 100));

  const chunk = 501;
  for (let i = 0; i < bitmap.length; i += chunk) {
    const payload = bitmap.slice(i, i + chunk);
    const packet = new Uint8Array(11 + payload.length);
    let p = 0;
    packet[p++] = 0x55;
    packet[p++] = i / chunk;
    packet[p++] = bytesPerLine;
    packet[p++] = canvas.height;
    packet[p++] = 0;
    packet[p++] = 0x99;
    packet[p++] = totalBytes >> 8; packet[p++] = totalBytes & 0xFF;
    packet[p++] = payload.length >> 8; packet[p++] = payload.length & 0xFF;
    packet.set(payload, p);
    packet[packet.length-1] = 0xAA;
    await writer.write(packet);
    await new Promise(r => setTimeout(r, 400));
  }

  document.getElementById('serialStatus').textContent = `Sent ${totalBytes} bytes (${canvas.width}×${canvas.height})`;
});
</script>
</body>
</html>
